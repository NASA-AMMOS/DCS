[build-system]
# Pinned so builds are repeatable: pip installs exactly these into an isolated build environment (this needs access to
# PyPI or a mirror configured through PIP_INDEX_URL / pip.conf). The extension built with this cffi runs against any
# runtime cffi that satisfies [project] dependencies below.
requires = [
    "setuptools==80.9.0",
    "cffi==2.0.0",
    "pycparser==2.23",
]
build-backend = "setuptools.build_meta"

[project]
name = "KmcSdlsClient"
version = "0.2.0"
description = "KmcSdlsClient provides the necessary python interfaces to the KMC Python C SDLS Interface. It enables missions control systems to apply and reverse security on telecommand transfer frames."
readme = "README.md"
requires-python = ">=3.9"
# Runtime requirement; 1.14.5 is the cffi that RHEL 9 ships for Python 3.9.
dependencies = [
    "cffi>=1.14.5; python_version < '3.12'",
    "cffi>=1.16; python_version == '3.12'",
    "cffi>=1.17.1; python_version == '3.13'",
    "cffi>=2.0; python_version >= '3.14'",
]
authors = [{ name = "DCS Development Team", email = "no-reply@jpl.nasa.gov" }]
urls = { Homepage = "https://github.com/NASA-AMMOS/DCS" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["gov*"]
