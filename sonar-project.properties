#sonar.sarifReportPaths="/home/runner/work/DCS/results/dcs_stripped.sarif"
sonar.sarifReportPaths=/home/runner/work/DCS/DCS/codeql-artifacts-for-sonar/java.sarif,/home/runner/work/DCS/DCS/codeql-artifacts-for-sonar/cpp.sarif

# JaCoCo XML reports collected from the build job (see .github/workflows/build.yml)
sonar.coverage.jacoco.xmlReportPaths=/home/runner/work/DCS/DCS/coverage-reports/*.xml

# List of all modules
sonar.modules=kmip-client,kmc-key-client,kmc-crypto,kmc-crypto-library,kmc-crypto-service,kmc-sdls-service,kmc-sa-db-api,kmc-sa-db-lib,kmc-sa-cli,kmc-sa-gui

# Set the version
sonar.projectVersion=4.0.0

# -------------------------------
# Individual module configurations
# -------------------------------

# kmip-client
kmip-client.sonar.projectBaseDir=kmip-client
kmip-client.sonar.sources=src/main
kmip-client.sonar.java.binaries=../build-output-for-sonar/kmip-client/classes

# kmc-key-client
kmc-key-client.sonar.projectBaseDir=kmc-key-client
kmc-key-client.sonar.sources=src/main
kmc-key-client.sonar.tests=src/test
kmc-key-client.sonar.java.binaries=../build-output-for-sonar/kmc-key-client/classes

# kmc-crypto
kmc-crypto.sonar.projectBaseDir=kmc-crypto
kmc-crypto.sonar.sources=src/main
kmc-crypto.sonar.tests=src/test
