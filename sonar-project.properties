# kmc-sdls-service
kmc-sdls-service.sonar.projectBaseDir=kmc-sdls-service
kmc-sdls-service.sonar.sources=src/main
kmc-sdls-service.sonar.tests=src/test
kmc-sdls-service.sonar.java.binaries=../build-output-for-sonar/kmc-sdls-service/classes

# kmc-sa-db-api
kmc-sa-db-api.sonar.projectBaseDir=kmc-sa-mgmt/kmc-sa-db-api
kmc-sa-db-api.sonar.sources=src/main
kmc-sa-db-api.sonar.tests=src/test
kmc-sa-db-api.sonar.java.binaries=../../build-output-for-sonar/kmc-sa-mgmt/kmc-sa-db-api/classes

# kmc-sa-db-lib
kmc-sa-db-lib.sonar.projectBaseDir=kmc-sa-mgmt/kmc-sa-db-lib
kmc-sa-db-lib.sonar.sources=src/main
kmc-sa-db-lib.sonar.tests=src/test
kmc-sa-db-lib.sonar.java.binaries=../../build-output-for-sonar/kmc-sa-mgmt/kmc-sa-db-lib/classes

# kmc-sa-cli
kmc-sa-cli.sonar.projectBaseDir=kmc-sa-mgmt/kmc-sa-cli
kmc-sa-cli.sonar.sources=src/main
kmc-sa-cli.sonar.tests=src/test
kmc-sa-cli.sonar.java.binaries=../../build-output-for-sonar/kmc-sa-mgmt/kmc-sa-cli/classes

# kmc-sa-gui
kmc-sa-gui.sonar.projectBaseDir=kmc-sa-mgmt/kmc-sa-gui
kmc-sa-gui.sonar.sources=src/main
kmc-sa-gui.sonar.tests=src/test,src/main/frontend/src,src/main/frontend/e2e,src/main/frontend/playwright.config.js
kmc-sa-gui.sonar.java.binaries=../../build-output-for-sonar/kmc-sa-mgmt/kmc-sa-gui/classes
# the frontend's vitest and Playwright files sit under src/main: analyse them as tests, not sources
kmc-sa-gui.sonar.exclusions=src/main/frontend/src/**/*.test.*,src/main/frontend/src/test/**,src/main/frontend/e2e/**,src/main/frontend/playwright.config.js,src/main/frontend/dist/**,src/main/frontend/coverage/**
kmc-sa-gui.sonar.test.inclusions=src/test/**,src/main/frontend/src/**/*.test.*,src/main/frontend/src/test/**,src/main/frontend/e2e/**,src/main/frontend/playwright.config.js
# vitest coverage of the frontend, collected from the build job (see .github/workflows/build.yml)
kmc-sa-gui.sonar.javascript.lcov.reportPaths=/home/runner/work/DCS/DCS/coverage-reports/kmc-sa-gui-frontend.lcov
# build/lint config and the entry point are not unit-tested; keep them out of the coverage figure
kmc-sa-gui.sonar.coverage.exclusions=src/main/frontend/*.config.js,src/main/frontend/src/main.jsx
